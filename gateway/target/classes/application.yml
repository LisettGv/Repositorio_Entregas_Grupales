server:
  port: 8080

spring:
  application:
    name: dsy1107-api-gateway-lab
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: posts-v1
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/api/v1/posts/**
              filters:
                - RewritePath=/api/v1/(?<segment>.*), /${segment}
                - AddResponseHeader=X-API-Version, v1
                - AddResponseHeader=X-Gateway-Lab, DSY1107
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials

            - id: posts-v2
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/api/v2/posts/**
              filters:
                - RewritePath=/api/v2/(?<segment>.*), /${segment}
                - AddResponseHeader=X-API-Version, v2
                - AddResponseHeader=X-Gateway-Lab, DSY1107
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials

lab:
  cors:
    enabled: true
    allowed-origin: http://127.0.0.1:5500